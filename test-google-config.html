<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Auth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Google Authentication Test</h1>
    
    <div id="status"></div>
    
    <div id="g_id_onload"
         data-client_id="763549280829-chb0u2g8vbc3uflojo61dua7832bdivd.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <script>
        function handleCredentialResponse(response) {
            document.getElementById('status').innerHTML = 'SUCCESS: Google authentication worked!';
            console.log('Google response:', response);
        }
        
        window.addEventListener('load', function() {
            setTimeout(() => {
                const gsiScript = document.querySelector('script[src*="gsi/client"]');
                if (gsiScript) {
                    document.getElementById('status').innerHTML = 'Google GSI script loaded successfully';
                } else {
                    document.getElementById('status').innerHTML = 'ERROR: Google GSI script failed to load';
                }
            }, 2000);
        });
    </script>
</body>
</html>
