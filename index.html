<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>media-muse-launch</title>
    <meta name="description" content="Lovable Generated Project" />

    <meta property="og:title" content="media-muse-launch" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root">
      <!-- Fallback content that will be shown if React doesn't load -->
      <div id="loading-fallback" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif;">
        <h1>SocialMuse</h1>
        <p>Loading application...</p>
        <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p id="loading-error" style="color: red; margin-top: 20px; display: none;">
          There was an error loading the application. Please try refreshing the page.
        </p>
      </div>
    </div>

    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <!-- Error handling script -->
    <script>
      // Show error message if the app doesn't load within 10 seconds
      setTimeout(function() {
        if (document.getElementById('loading-fallback')) {
          document.getElementById('loading-error').style.display = 'block';
        }
      }, 10000);
    </script>

    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback script if the module script fails -->
    <script nomodule>
      document.getElementById('loading-error').style.display = 'block';
      document.getElementById('loading-error').innerText =
        'Your browser does not support modern JavaScript. Please use a more recent browser.';
    </script>
  </body>
</html>
